<!DOCTYPE html>
<html b:version='2' class='v2' expr:dir='data:blog.languageDirection' expr:lang='data:blog.locale.language' mobile='no' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <meta charset='UTF-8'/>
  <meta content='width=device-width, initial-scale=1' name='viewport'/>
  <title><data:blog.pageTitle/></title>
  <b:include data='blog' name='all-head-content'/>
  
  <b:skin><![CDATA[
/* FAST THEME - Minimal & Same Layout PC + Mobile */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0a0e17;
    color: #e8edf5;
    line-height: 1.6;
}
a { text-decoration: none; color: inherit; }
img { max-width: 100%; height: auto; display: block; }

/* HEADER */
.site-header {
    background: #0f1a2e;
    border-bottom: 2px solid #00e676;
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: #00e676; color: #0a0e17;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold;
}
.logo-title { color: #fff; font-size: 18px; font-weight: 800; }
.logo-title span { color: #00e676; }
.main-nav {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 13px; font-weight: 600;
}
.main-nav a { color: #c5d0e0; padding: 4px 0; }
.main-nav a:hover { color: #00e676; }

/* CONTAINER */
.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 16px;
}

/* SECTION HEADING */
.section-heading {
    font-size: 20px;
    color: #fff;
    font-weight: 800;
    margin: 24px 0 16px;
    padding-left: 12px;
    border-left: 4px solid #00e676;
}

/* ARTICLE GRID - 4 cols desktop, 2 cols mobile */
.article-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}
.article-card {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color .2s;
    display: flex;
    flex-direction: column;
}
.article-card:hover { border-color: #00e676; }
.article-image {
    width: 100%;
    height: 140px;
    overflow: hidden;
    background: #1c2a44;
}
.article-image img { width: 100%; height: 100%; object-fit: cover; }
.article-card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
.article-card h3 {
    font-size: 14px;
    line-height: 1.4;
    color: #fff;
    font-weight: 700;
    margin-bottom: 8px;
}
.article-card h3 a:hover { color: #00e676; }
.article-card .card-date {
    color: #7a8ba3;
    font-size: 11px;
    margin-top: auto;
    margin-bottom: 12px;
}

/* OPEN BUTTON (CARD & POST) */
.open-btn {
    display: block;
    width: 100%;
    background: #ff1744;
    color: #fff !important;
    text-align: center;
    padding: 10px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    transition: background 0.2s;
}
.open-btn:hover { background: #d50000; }

/* FEATURED */
.featured {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0;
}
.featured-image {
    width: 100%;
    height: 280px;
    overflow: hidden;
    background: #1c2a44;
}
.featured-image img { width: 100%; height: 100%; object-fit: cover; }
.featured-text { padding: 24px; display: flex; flex-direction: column; justify-content: center; }
.featured-text .featured-tag {
    display: inline-block;
    background: #ff1744;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 15px;
    text-transform: uppercase;
    margin-bottom: 12px;
    align-self: flex-start;
}
.featured-text h1 {
    font-size: 24px;
    line-height: 1.3;
    color: #fff;
    font-weight: 800;
    margin-bottom: 10px;
}
.featured-text h1 a:hover { color: #00e676; }
.featured-text p { color: #9aabc2; font-size: 14px; margin-bottom: 16px; }

/* SIDEBAR */
.layout {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 24px;
}
.sidebar-widget {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
}
.sidebar-widget-title {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1c2a44;
}
.side-list { list-style: none; }
.side-list li {
    padding: 8px 0;
    border-bottom: 1px solid #1c2a44;
    font-size: 13px;
}
.side-list li:last-child { border-bottom: none; }
.side-list a { color: #d5deea; }
.side-list a:hover { color: #00e676; }

/* SEARCH */
.search-form { display: flex; gap: 6px; }
.search-form input {
    flex: 1;
    padding: 8px 10px;
    background: #0d1420;
    border: 1px solid #1c2a44;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
}
.search-form input:focus { outline: none; border-color: #00e676; }
.search-form button {
    background: #00e676;
    color: #0a0e17;
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    font-weight: 800;
    cursor: pointer;
    font-size: 13px;
}

/* PAGE TITLE BAR */
.page-title-bar {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-left: 4px solid #00e676;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}
.page-title-bar h1 {
    font-size: 22px;
    color: #fff;
    font-weight: 800;
}
.page-title-bar p {
    color: #7a8ba3;
    font-size: 13px;
    margin-top: 6px;
}

/* ARCHIVE GRID - 3 cols desktop, 2 mobile */
.archive-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}
.archive-card {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.archive-card:hover { border-color: #00e676; }
.archive-image {
    width: 100%;
    height: 160px;
    overflow: hidden;
    background: #1c2a44;
}
.archive-image img { width: 100%; height: 100%; object-fit: cover; }
.archive-content { padding: 14px; display: flex; flex-direction: column; flex: 1; }
.archive-content h3 {
    font-size: 15px;
    color: #fff;
    line-height: 1.4;
    margin-bottom: 6px;
    font-weight: 700;
}
.archive-content h3 a:hover { color: #00e676; }
.archive-content .archive-meta {
    color: #7a8ba3;
    font-size: 12px;
    margin-top: auto;
    margin-bottom: 12px;
}

/* PAGINATION */
.blog-pager {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 30px 0;
}
.blog-pager a {
    background: #101a2c;
    border: 1px solid #1c2a44;
    color: #00e676;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
}
.blog-pager a:hover { background: #00e676; color: #0a0e17; }

/* SINGLE POST */
.single-post-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 16px;
}
.single-post {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 12px;
    padding: 24px;
}
.post-categories { margin-bottom: 12px; }
.post-categories a {
    color: #00e676;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: 6px;
}
.post-title {
    font-size: 26px;
    line-height: 1.3;
    color: #fff;
    margin-bottom: 12px;
    font-weight: 800;
}
.post-meta {
    color: #7a8ba3;
    font-size: 13px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1c2a44;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}
.post-meta .meta-label { color: #00e676; font-weight: 700; }
.post-content {
    font-size: 15px;
    line-height: 1.8;
    color: #c5d0e0;
    margin-bottom: 24px;
}
.post-content h2 { font-size: 22px; color: #fff; margin: 24px 0 12px; }
.post-content h3 { font-size: 18px; color: #fff; margin: 20px 0 10px; }
.post-content p { margin-bottom: 14px; }
.post-content a { color: #00e676; text-decoration: underline; }
.post-content img { border-radius: 6px; margin: 16px 0; }
.post-content ul, .post-content ol { margin: 14px 0; padding-left: 22px; }
.post-content li { margin-bottom: 6px; }
.post-content table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.post-content table th, .post-content table td { border: 1px solid #1c2a44; padding: 8px; }
.post-content table th { background: #1c2a44; color: #00e676; }

/* POST NAVIGATION */
.post-nav {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #1c2a44;
}
.post-nav a {
    color: #00e676;
    font-weight: 700;
    font-size: 13px;
    max-width: 48%;
}
.post-nav a:hover { text-decoration: underline; }
.post-nav .next { text-align: right; margin-left: auto; }

/* STATIC PAGE */
.static-page {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 12px;
    padding: 28px;
    max-width: 900px;
    margin: 20px auto;
}
.static-page h1 {
    font-size: 26px;
    color: #fff;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1c2a44;
}
.static-page-content { font-size: 15px; line-height: 1.8; color: #c5d0e0; }
.static-page-content h2 { font-size: 20px; color: #fff; margin: 20px 0 10px; }
.static-page-content p { margin-bottom: 14px; }
.static-page-content a { color: #00e676; }

/* NO POSTS */
.no-posts {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
}
.no-posts h2 { color: #fff; font-size: 20px; margin-bottom: 8px; }
.no-posts p { color: #7a8ba3; font-size: 14px; }

/* COMMENTS */
.comments-area {
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
}
.comment-respond {
    background: #101a2c;
    border: 1px solid #1c2a44;
    border-radius: 12px;
    padding: 24px;
}
.comment-reply-title {
    font-size: 18px;
    color: #fff;
    margin-bottom: 16px;
}
.comment-form iframe { width: 100%; border: 0; }

/* FOOTER */
.site-footer {
    background: #0d1420;
    border-top: 2px solid #00e676;
    margin-top: 40px;
    padding: 40px 16px 20px;
}
.footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 30px;
}
.footer-title {
    color: #00e676;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
}
.footer-links { list-style: none; }
.footer-links li { margin-bottom: 8px; }
.footer-links a { color: #c5d0e0; font-size: 13px; }
.footer-links a:hover { color: #00e676; }
.footer-about p { color: #9aabc2; font-size: 13px; line-height: 1.7; }
.footer-bottom {
    max-width: 1200px;
    margin: 24px auto 0;
    padding-top: 20px;
    border-top: 1px solid #1c2a44;
    text-align: center;
    color: #7a8ba3;
    font-size: 12px;
}

/* SCROLL TO TOP */
.scroll-to-top {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #00e676;
    color: #0a0e17;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    z-index: 99;
}
.scroll-to-top.show { display: flex; }

/* RESPONSIVE - same layout but adjusted */
@media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .featured { grid-template-columns: 1fr; }
    .featured-image { height: 220px; }
    .article-grid { grid-template-columns: repeat(2, 1fr); }
    .archive-grid { grid-template-columns: repeat(2, 1fr); }
    .footer-inner { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 500px) {
    .main-nav { font-size: 12px; gap: 10px; }
    .logo-title { font-size: 15px; }
    .logo-icon { width: 34px; height: 34px; font-size: 18px; }
    .article-grid { grid-template-columns: 1fr; }
    .archive-grid { grid-template-columns: 1fr; }
    .footer-inner { grid-template-columns: 1fr; }
    .post-title { font-size: 20px; }
    .single-post { padding: 16px; }
    .featured-text { padding: 16px; }
    .featured-text h1 { font-size: 18px; }
}
  ]]></b:skin>

<body>

<!-- HEADER -->
<header class='site-header'>
    <div class='header-inner'>
        <a class='logo' expr:href='data:blog.homepageUrl'>
            <div class='logo-icon'>&#9917;</div>
            <div class='logo-title'>Sport<span>Streaming</span></div>
        </a>
        <nav class='main-nav'>
            <a expr:href='data:blog.homepageUrl'>Home</a>
            <a expr:href='data:blog.homepageUrl + &quot;search/label/Football&quot;'>Football</a>
            <a expr:href='data:blog.homepageUrl + &quot;search/label/Cricket&quot;'>Cricket</a>
        </nav>
    </div>
</header>

<!-- MAIN CONTENT -->
<b:section class='main-section' id='main' showaddelement='yes'>
  <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog' version='1'>
    <b:widget-settings>
      <b:widget-setting name='showDateHeader'>false</b:widget-setting>
      <b:widget-setting name='showShareButtons'>false</b:widget-setting>
      <b:widget-setting name='authorLabel'>By</b:widget-setting>
      <b:widget-setting name='showCommentLink'>true</b:widget-setting>
      <b:widget-setting name='showAuthor'>false</b:widget-setting>
      <b:widget-setting name='style.unittype'>TextAndImage</b:widget-setting>
      <b:widget-setting name='reactionsLabel'/>
      <b:widget-setting name='showAuthorProfile'>false</b:widget-setting>
      <b:widget-setting name='style.layout'>1x1</b:widget-setting>
      <b:widget-setting name='showLabels'>true</b:widget-setting>
      <b:widget-setting name='showLocation'>true</b:widget-setting>
      <b:widget-setting name='showTimestamp'>false</b:widget-setting>
      <b:widget-setting name='postsPerAd'>1</b:widget-setting>
      <b:widget-setting name='showBacklinks'>false</b:widget-setting>
      <b:widget-setting name='showInlineAds'>false</b:widget-setting>
      <b:widget-setting name='showReactions'>false</b:widget-setting>
    </b:widget-settings>
    <b:includable id='main'>

      <!-- ==================== HOMEPAGE ==================== -->
      <b:if cond='data:blog.url == data:blog.homepageUrl'>
        <div class='container'>
          <div class='layout'>
            <main>
              <!-- FEATURED -->
              <b:loop index='i' values='data:posts' var='post'>
                <b:if cond='data:post.labels'>
                  <b:loop values='data:post.labels' var='label'>
                    <b:if cond='data:label.name == &quot;Featured&quot;'>
                      <section class='featured'>
                        <div class='featured-image'>
                          <!-- SMARTLINK ON IMAGE -->
                          <a href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored' target='_blank'>
                            <b:if cond='data:post.firstImageUrl'>
                              <img expr:alt='data:post.title' expr:src='data:post.firstImageUrl' loading='lazy'/>
                            <b:else/>
                              <img alt='Sport' loading='lazy' src='https://via.placeholder.com/600x400/1c2a44/00e676?text=Sport'/>
                            </b:if>
                          </a>
                        </div>
                        <div class='featured-text'>
                          <span class='featured-tag'>🔥 Featured</span>
                          <h1><a expr:href='data:post.url'><data:post.title/></a></h1>
                          <p>Latest sports news, match highlights, and live updates.</p>
                          <!-- SMARTLINK OPEN BUTTON -->
                          <a class='open-btn auto-click-btn' href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored'>Open &#9654;</a>
                        </div>
                      </section>
                    </b:if>
                  </b:loop>
                </b:if>
              </b:loop>

              <!-- LATEST POSTS -->
              <h2 class='section-heading'>Latest Matches</h2>
              <section class='article-grid'>
                <b:loop index='i' values='data:posts' var='post'>
                  <b:if cond='data:i &lt; 8'>
                    <article class='article-card'>
                      <div class='article-image'>
                        <!-- SMARTLINK ON IMAGE -->
                        <a href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored' target='_blank'>
                          <b:if cond='data:post.firstImageUrl'>
                            <img expr:alt='data:post.title' expr:src='data:post.firstImageUrl' loading='lazy'/>
                          <b:else/>
                            <img alt='Sport' loading='lazy' src='https://via.placeholder.com/400x250/1c2a44/00e676?text=Sport'/>
                          </b:if>
                        </a>
                      </div>
                      <div class='article-card-content'>
                        <h3><a expr:href='data:post.url'><data:post.title/></a></h3>
                        <div class='card-date'><data:post.date/></div>
                        <!-- SMARTLINK OPEN BUTTON -->
                        <a class='open-btn auto-click-btn' href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored'>Open &#9654;</a>
                      </div>
                    </article>
                  </b:if>
                </b:loop>
              </section>
            </main>

            <aside>
              <div class='sidebar-widget'>
                <div class='sidebar-widget-title'>Search</div>
                <form class='search-form' expr:action='data:blog.homepageUrl + &quot;search&quot;' method='get'>
                  <input name='q' placeholder='Search...' type='text'/>
                  <button type='submit'>Go</button>
                </form>
              </div>

              <div class='sidebar-widget'>
                <div class='sidebar-widget-title'>Categories</div>
                <ul class='side-list'>
                  <li><a expr:href='data:blog.homepageUrl + &quot;search/label/Football&quot;'>&#9917; Football</a></li>
                  <li><a expr:href='data:blog.homepageUrl + &quot;search/label/Cricket&quot;'>🏏 Cricket</a></li>
                </ul>
              </div>

              <!-- SMARTLINK BUTTON -->
              <div class='sidebar-widget'>
                <div class='sidebar-widget-title'>🔴 Live Stream</div>
                <a class='open-btn auto-click-btn' href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored'>Watch Live Now</a>
              </div>
            </aside>
          </div>
        </div>

      <!-- ==================== LABEL / SEARCH / ARCHIVE ==================== -->
      <b:elseif cond='data:blog.pageType == &quot;archive&quot; or data:blog.searchLabel or data:blog.searchQuery'/>
        <div class='container'>
          <div class='page-title-bar'>
            <h1>
              <b:if cond='data:blog.searchLabel'>
                🏆 <data:blog.searchLabel/>
              <b:elseif cond='data:blog.searchQuery'/>
                🔍 Search: <data:blog.searchQuery/>
              <b:else/>
                Archive
              </b:if>
            </h1>
            <p>Browse all posts in this category</p>
          </div>

          <b:if cond='data:posts.empty'>
            <div class='no-posts'>
              <h2>No posts found</h2>
              <p>Try a different search or category.</p>
            </div>
          <b:else/>
            <section class='archive-grid'>
              <b:loop values='data:posts' var='post'>
                <article class='archive-card'>
                  <div class='archive-image'>
                    <!-- SMARTLINK ON IMAGE -->
                    <a href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored' target='_blank'>
                      <b:if cond='data:post.firstImageUrl'>
                        <img expr:alt='data:post.title' expr:src='data:post.firstImageUrl' loading='lazy'/>
                      <b:else/>
                        <img alt='Sport' loading='lazy' src='https://via.placeholder.com/400x250/1c2a44/00e676?text=Sport'/>
                      </b:if>
                    </a>
                  </div>
                  <div class='archive-content'>
                    <h3><a expr:href='data:post.url'><data:post.title/></a></h3>
                    <div class='archive-meta'><data:post.date/></div>
                    <!-- SMARTLINK OPEN BUTTON -->
                    <a class='open-btn auto-click-btn' href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored'>Open &#9654;</a>
                  </div>
                </article>
              </b:loop>
            </section>
          </b:if>

          <div class='blog-pager'>
            <b:if cond='data:newerPageUrl'>
              <a expr:href='data:newerPageUrl'>&#8592; Newer</a>
            </b:if>
            <a expr:href='data:blog.homepageUrl'>Home</a>
            <b:if cond='data:olderPageUrl'>
              <a expr:href='data:olderPageUrl'>Older &#8594;</a>
            </b:if>
          </div>
        </div>

      <!-- ==================== STATIC PAGE ==================== -->
      <b:elseif cond='data:blog.pageType == &quot;static_page&quot;'/>
        <b:loop values='data:posts' var='post'>
          <div class='static-page'>
            <h1><data:post.title/></h1>
            <div class='static-page-content'>
              <data:post.body/>
            </div>
          </div>
        </b:loop>

      <!-- ==================== SINGLE POST ==================== -->
      <b:else/>
        <b:loop values='data:posts' var='post'>
          <div class='single-post-container'>
            <article class='single-post'>
              <div class='post-categories'>
                <b:loop values='data:post.labels' var='label'>
                  <a expr:href='data:label.url'><data:label.name/></a>
                </b:loop>
              </div>
              <h1 class='post-title'><data:post.title/></h1>
              <div class='post-meta'>
                <span><span class='meta-label'>By</span> <data:post.author/></span>
                <span><data:post.date/></span>
              </div>
              <div class='post-content'>
                <data:post.body/>
              </div>

              <!-- SMARTLINK OPEN BUTTON FOR POST PAGE -->
              <div style='text-align: center; margin: 24px 0;'>
                <a class='open-btn auto-click-btn' href='https://budgetezy.org/4/2e3f86a483123ee236db5dca4785d436' rel='nofollow sponsored' style='display: inline-block; width: auto; padding: 14px 40px; font-size: 16px;'>Open Link &#9654;</a>
              </div>

              <nav class='post-nav'>
                <b:if cond='data:newerPageUrl'>
                  <a expr:href='data:newerPageUrl' rel='prev'>&#8592; Previous Post</a>
                </b:if>
                <b:if cond='data:olderPageUrl'>
                  <a class='next' expr:href='data:olderPageUrl' rel='next'>Next Post &#8594;</a>
                </b:if>
              </nav>
            </article>
          </div>

          <!-- COMMENTS -->
          <div class='comments-area'>
            <div class='comment-respond' id='respond'>
              <h3 class='comment-reply-title'>Leave a Comment</h3>
              <div class='comment-form'>
                <a name='comment-form'/>
                <iframe allowtransparency='true' class='blogger-iframe-colorize blogger-comment-from-post' expr:height='data:cmtIframeInitialHeight' expr:src='data:post.commentFormIframeSrc' frameborder='0' id='comment-editor' name='comment-editor' width='100%'/>
                <data:post.cmtfpIframe/>
                <script type='text/javascript'>
                  BLOG_CMT_createIframe(&#39;<data:post.appRpcRelayPath/>&#39;);
                </script>
              </div>
            </div>
          </div>
        </b:loop>
      </b:if>

    </b:includable>
    <b:includable id='backlinkDeleteIcon' var='backlink'/>
    <b:includable id='backlinks' var='post'/>
    <b:includable id='comment-form' var='post'/>
    <b:includable id='commentDeleteIcon' var='comment'/>
    <b:includable id='comment_count_picker' var='post'/>
    <b:includable id='comment_picker' var='post'/>
    <b:includable id='comments' var='post'/>
    <b:includable id='feedLinks'/>
    <b:includable id='feedLinksBody' var='links'/>
    <b:includable id='iframe_comments' var='post'/>
    <b:includable id='mobile-index-post' var='post'/>
    <b:includable id='mobile-main' var='top'/>
    <b:includable id='mobile-nextprev'/>
    <b:includable id='mobile-post' var='post'/>
    <b:includable id='nextprev'/>
    <b:includable id='post' var='post'/>
    <b:includable id='postQuickEdit' var='post'/>
    <b:includable id='shareButtons' var='post'/>
    <b:includable id='status-message'/>
    <b:includable id='threaded-comment-form' var='post'/>
    <b:includable id='threaded_comment_js' var='post'/>
    <b:includable id='threaded_comments' var='post'/>
  </b:widget>
</b:section>

<!-- ==================== TRUE AUTO CLICK SCRIPT ==================== -->
<script type='text/javascript'>
  //<![CDATA[
  window.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {
      var openBtns = document.querySelectorAll('.auto-click-btn');
      if (openBtns.length > 0) {
        var targetBtn = openBtns[0];
        targetBtn.click(); 
      }
    }, 2500);
  });
  //]]>
</script>
<!-- ==================== TRUE AUTO CLICK SCRIPT END ==================== -->


<script type='text/javascript'>
  //<![CDATA[
  (function() {
    var btn = document.getElementById('scrollToTopBtn');
    if (!btn) return;
    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) btn.classList.add('show');
      else btn.classList.remove('show');
    }, { passive: true });
    btn.addEventListener('click', function() {
      window.scrollTo(0, 0);
    });
  })();
  //]]>
</script>
